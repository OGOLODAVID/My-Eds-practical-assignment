
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Login Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            color: #243b55;
            margin-bottom: 10px;
        }

        p {
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #141e30;
        }

        .footer {
            margin-top: 20px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Welcome Back!</h2>
        <p>Please login to your account</p>

        <form onsubmit="event.preventDefault(); alert('Demo login form only!');">
            <input type="email" placeholder="Email Address" required>

            <input type="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <div class="footer">
            Don't have an account? Sign up
        </div>
    </div>

</body>
</html>
